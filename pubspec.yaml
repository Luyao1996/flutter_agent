version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  cupertino_icons: ">=1.0.6 <3.0.0"
  desktop_drop: ">=0.7.1 <0.9.0"
  file_picker: ">=9.2.3 <10.0.0"
  flutter:
    sdk: flutter
